spring.application.name=feed
spring.main.banner-mode=off

# Same env vars as every other stack. Spring resolves ${VAR:default} from the process env.
server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}

# Virtual threads: Tomcat runs each request on a virtual thread (no fixed worker-thread cap),
# carriers = usable cores (ForkJoinPool sized from availableProcessors, i.e. the affinity mask).
spring.threads.virtual.enabled=true

# ~1M concurrent keep-alive clients, idle up to ~40 s between requests.
# Tomcat default max-connections is 8192 (Spring ignores -1 here, so a large explicit number).
server.tomcat.max-connections=2000000
# listen(2) backlog (default 100).
server.tomcat.accept-count=8192
# Idle keep-alive timeout (default = connection-timeout = 20 s for Spring Boot's Tomcat): 90 s > 75 s.
server.tomcat.keep-alive-timeout=90s
server.tomcat.connection-timeout=90s
# Default 100 requests per connection, then Tomcat closes it; unlimited.
server.tomcat.max-keep-alive-requests=-1

# Optional second listener (env EXTRA_PORT): an additional Tomcat connector with the same settings, see TomcatConfig.

# Standard response compression (gzip when the client sends Accept-Encoding: gzip).
# min-response-size stays at the 2 KB default, but Tomcat only applies it when Content-Length is known;
# Jackson responses are chunked, so every JSON body is gzipped when the client asks (see README).
server.compression.enabled=true
server.compression.mime-types=application/json

# HikariCP over pgjdbc (DATABASE_URL, translated in DataSourceConfig).
# maximum-pool-size = env DB_POOL, else min(128, 8 x cores), set in DataSourceConfig.
# Acquire timeout 5 s (many virtual threads can queue for a connection).
spring.datasource.hikari.connection-timeout=5000
# The database already has its schema and data: never run schema/data init scripts.
spring.sql.init.mode=never

# Wire format: snake_case keys (created_at, like_count, already_liked, post_id, uptime_s).
spring.jackson.property-naming-strategy=SNAKE_CASE
