# Postgres 18 on the database box (16 vCPU, 32 GB, NVMe), included from postgresql.conf by box/setup-db-box.sh.
# Fixed for every submission. Standard production sizing (pgtune-style for an OLTP box of this size);
# durability defaults kept (synchronous_commit = on, fsync = on).
listen_addresses = '*'
max_connections = 600            # your server may open at most 512 (rule 5); the rest is headroom for admin sessions
shared_buffers = 8GB             # 25% of RAM
effective_cache_size = 24GB      # 75% of RAM
maintenance_work_mem = 1GB
# work_mem: default (4MB)
huge_pages = try
random_page_cost = 1.1           # SSD
effective_io_concurrency = 200
wal_buffers = 64MB
wal_compression = lz4
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 16GB
min_wal_size = 4GB
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 2
jit = off                        # OLTP: JIT only adds latency to these short queries
log_min_duration_statement = -1

# Plain TCP for everyone: several drivers default to TLS when the server offers it, others don't. Ubuntu enables ssl
# with a snakeoil cert; the two boxes share a datacenter link, so it's off.
ssl = off

# The feed query (20 posts JOIN users + a like count each) gets a Memoize node on users; Memoize zeroes a hash table
# sized from work_mem on EVERY execution: 24% of Postgres CPU was memset under ExecMemoize. EXPLAIN ANALYZE on the
# seed: 1.36 ms with Memoize at the default work_mem, 0.40 ms without. Server-wide, so the same for every app.
enable_memoize = off
